server:
  port: 8080

spring:
  application:
    name: cp-oa-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cp_oa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai

shiro:
  annotations:
    # 本项目使用 SecurityUtils.getSubject().checkRole(...) 做运行时鉴权。
    # 如需使用 @RequiresRoles/@RequiresPermissions 注解，改为 true 即可。
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

cp-oa:
  jwt:
    # 生产环境务必通过环境变量覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:cp-oa-dev-secret-change-me-0123456789abcdef}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  feishu:
    enabled: ${FEISHU_ENABLED:true}
    app-id: ${FEISHU_APP_ID:cli_aa6da0336df8dc06}
    # 飞书应用的 App Secret，必须通过环境变量注入
    app-secret: ${FEISHU_APP_SECRET:}
    base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
    sync-cron: "${FEISHU_SYNC_CRON:0 30 2 * * *}"
    # 事件订阅的 Verification Token，未配置时不接收事件回调
    verification-token: ${FEISHU_VERIFICATION_TOKEN:}
    # 事件订阅的 Encrypt Key，配置后启用签名校验与报文解密
    encrypt-key: ${FEISHU_ENCRYPT_KEY:}
    # 同步时清理飞书侧已删除的部门、禁用已离职/移除的用户
    cleanup-missing: ${FEISHU_CLEANUP_MISSING:true}
    # 事件触发的去抖窗口（毫秒），窗口内的事件合并为一次同步
    sync-debounce-ms: ${FEISHU_SYNC_DEBOUNCE_MS:3000}

logging:
  level:
    com.cpoa: debug
